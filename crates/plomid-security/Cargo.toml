[package]
name = "plomid-security"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Security policy and request identity primitives for PLOMID services"
license = "Apache-2.0"
authors = ["Sainath Sapa <info.djsai@gmail.com>"]
repository = "https://github.com/plomid/plomid-mcp"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
tokio = { version = "1.48", features = ["sync"] }
