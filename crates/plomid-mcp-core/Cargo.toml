[package]
name = "plomid-mcp-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Reusable PLOMID-MCP configuration, database, MCP, SQL, and transport implementation"
license = "Apache-2.0"
authors = ["Sainath Sapa <info.djsai@gmail.com>"]

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
deadpool-postgres = { version = "0.14", features = ["rt_tokio_1"] }
plomid-security = { path = "../plomid-security" }
rmcp = { version = "3.5.1", features = ["server", "macros", "schemars", "transport-io", "transport-async-rw", "transport-streamable-http-server"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
schemars = "1.0"
sqlparser = { version = "=0.63.0", features = ["visitor"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
tokio-postgres-rustls = { version = "=0.14.0", features = ["ring", "native-certs", "webpki-roots"] }
toml = "0.9"
tokio = { version = "1.48", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2.5"

[dev-dependencies]
tempfile = "3.23"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = "allow"
unused_async_trait_impl = "allow"
