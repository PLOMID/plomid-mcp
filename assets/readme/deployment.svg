<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">PLOMID-MCP transports and deployment</title><desc id="desc">Local MCP clients can launch the server over STDIO. Local or remote MCP clients can connect by Streamable HTTP to the server directly or to a containerized server. All deployment paths connect from PLOMID-MCP over the supported SQL protocol to an independent PLOMID database; remote HTTP uses TLS and bearer authentication.</desc>
  <defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#0a0b0d" stroke-opacity=".04"/></pattern><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#e2683c"/></marker></defs>
  <rect width="1200" height="470" fill="#f3f1ec"/><rect width="1200" height="470" fill="url(#grid)"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <text x="38" y="43" fill="#68645d" font-size="12" letter-spacing="2">TRANSPORT AND DEPLOYMENT / CHOOSE THE CLIENT BOUNDARY</text>
    <text x="42" y="91" fill="#68645d" font-size="10" letter-spacing="1">CLIENT PROCESS</text><text x="400" y="91" fill="#68645d" font-size="10" letter-spacing="1">PLOMID-MCP RUNTIME</text><text x="930" y="91" fill="#68645d" font-size="10" letter-spacing="1">DATABASE SERVICE</text>
    <rect x="38" y="111" width="265" height="112" rx="4" fill="#0a0b0d"/><text x="66" y="146" fill="#e2683c" font-size="10">PATH A / LOCAL</text><text x="66" y="175" fill="#f3f1ec" font-size="15" font-weight="700">MCP client</text><text x="66" y="198" fill="#aaa69f" font-size="11">spawns server process</text>
    <rect x="376" y="111" width="336" height="112" rx="4" fill="#e2683c"/><text x="404" y="146" fill="#0a0b0d" font-size="10">STDIO · PROCESS PIPE</text><text x="404" y="175" fill="#0a0b0d" font-size="15" font-weight="700">PLOMID-MCP binary</text><text x="404" y="198" fill="#0a0b0d" font-size="11">protocol on stdout · logs on stderr</text>
    <path d="M303 167h64" stroke="#e2683c" stroke-width="2" marker-end="url(#arr)"/><text x="335" y="151" fill="#68645d" font-size="9" text-anchor="middle">MCP</text>
    <path d="M712 167h172" stroke="#e2683c" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="900" y="111" width="260" height="112" rx="4" fill="#fffefa" stroke="#bdb9b1"/><text x="928" y="146" fill="#68645d" font-size="10">SUPPORTED SQL</text><text x="928" y="175" fill="#0a0b0d" font-size="15" font-weight="700">PLOMID database</text><text x="928" y="198" fill="#68645d" font-size="11">independent service</text>

    <rect x="38" y="260" width="265" height="142" rx="4" fill="#0a0b0d"/><text x="66" y="295" fill="#e2683c" font-size="10">PATH B / LOCAL OR REMOTE</text><text x="66" y="324" fill="#f3f1ec" font-size="15" font-weight="700">MCP-compatible client</text><text x="66" y="348" fill="#aaa69f" font-size="11">HTTP-capable integration</text>
    <rect x="376" y="260" width="336" height="142" rx="4" fill="#fffefa" stroke="#0a0b0d"/><text x="404" y="295" fill="#e2683c" font-size="10">STREAMABLE HTTP</text><text x="404" y="324" fill="#0a0b0d" font-size="15" font-weight="700">PLOMID-MCP server</text><text x="404" y="348" fill="#68645d" font-size="11">direct process or container</text><text x="404" y="376" fill="#68645d" font-size="10">remote: HTTPS + bearer identity</text>
    <path d="M303 331h64" stroke="#e2683c" stroke-width="2" marker-end="url(#arr)"/><text x="335" y="315" fill="#68645d" font-size="9" text-anchor="middle">HTTP / MCP</text>
    <rect x="474" y="362" width="203" height="26" rx="2" fill="#e7e3da"/><text x="575" y="379" fill="#0a0b0d" font-size="9" text-anchor="middle">OPTION: CONTAINERIZED RUNTIME</text>
    <path d="M712 331h172" stroke="#e2683c" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="900" y="260" width="260" height="142" rx="4" fill="#fffefa" stroke="#bdb9b1"/><text x="928" y="295" fill="#68645d" font-size="10">DATABASE NETWORK</text><text x="928" y="324" fill="#0a0b0d" font-size="15" font-weight="700">PLOMID database</text><text x="928" y="348" fill="#68645d" font-size="11">reachable host / service name</text><text x="928" y="376" fill="#68645d" font-size="10">TLS trust + hostname verification</text>
    <text x="38" y="442" fill="#68645d" font-size="10">Container localhost is the container itself. Route to the database using a reachable host or shared network.</text>
  </g>
</svg>
