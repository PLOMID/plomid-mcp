<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">PLOMID-MCP security model</title><desc id="desc">Default query controls include parser-backed SQL policy, bounded parameters and results, and redacted errors. Configurable deployment controls include bearer identity and TLS verification. Controlled writes are a separate opt-in path requiring server policy, an approval token, HTTP write scope where authentication is enabled, idempotency, and database grants.</desc>
  <defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#0a0b0d" stroke-opacity=".04"/></pattern></defs>
  <rect width="1200" height="470" fill="#f3f1ec"/><rect width="1200" height="470" fill="url(#grid)"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <text x="38" y="43" fill="#68645d" font-size="12" letter-spacing="2">SECURITY ARCHITECTURE / DEFAULTS AND EXPLICIT CONFIGURATION</text>
    <rect x="38" y="76" width="720" height="330" rx="4" fill="#0a0b0d"/><path d="M38 76h720v5H38Z" fill="#e2683c"/>
    <text x="66" y="112" fill="#f3f1ec" font-size="18" font-weight="700">Server-side controls</text><text x="330" y="112" fill="#aaa69f" font-size="11">applicable to each operation class</text>
    <g>
      <rect x="66" y="145" width="300" height="87" rx="3" fill="#f3f1ec"/><text x="84" y="171" fill="#e2683c" font-size="10" letter-spacing="1">SQL POLICY</text><text x="84" y="197" fill="#0a0b0d" font-size="12" font-weight="700">One statement · mutation guards</text><text x="84" y="217" fill="#68645d" font-size="10">data-modifying CTEs rejected for query mode</text>
      <rect x="386" y="145" width="344" height="87" rx="3" fill="#f3f1ec"/><text x="404" y="171" fill="#e2683c" font-size="10" letter-spacing="1">PARAMETERS</text><text x="404" y="197" fill="#0a0b0d" font-size="12" font-weight="700">Bound values · safe compatibility path</text><text x="404" y="217" fill="#68645d" font-size="10">no caller text interpolation by policy bypass</text>
      <rect x="66" y="249" width="300" height="87" rx="3" fill="#f3f1ec"/><text x="84" y="275" fill="#e2683c" font-size="10" letter-spacing="1">RESOURCE BOUNDS</text><text x="84" y="301" fill="#0a0b0d" font-size="12" font-weight="700">Time · rows · bytes · concurrency</text><text x="84" y="321" fill="#68645d" font-size="10">tool and process limits apply</text>
      <rect x="386" y="249" width="344" height="87" rx="3" fill="#f3f1ec"/><text x="404" y="275" fill="#e2683c" font-size="10" letter-spacing="1">ERRORS AND LOGGING</text><text x="404" y="301" fill="#0a0b0d" font-size="12" font-weight="700">Stable errors · secret redaction</text><text x="404" y="321" fill="#68645d" font-size="10">no connection URL or raw backend detail to client</text>
      <text x="66" y="375" fill="#aaa69f" font-size="10">Database role privileges remain the final data-access boundary.</text>
    </g>
    <rect x="786" y="76" width="376" height="154" rx="4" fill="#fffefa" stroke="#bdb9b1"/><text x="812" y="111" fill="#68645d" font-size="10" letter-spacing="1.2">DEPLOYMENT CONTROLS / CONFIGURED</text>
    <circle cx="817" cy="148" r="4" fill="#e2683c"/><text x="832" y="152" fill="#0a0b0d" font-size="12" font-weight="700">HTTP bearer identity + scopes</text><text x="832" y="171" fill="#68645d" font-size="10">remote bind defaults to required authentication</text>
    <circle cx="817" cy="198" r="4" fill="#e2683c"/><text x="832" y="202" fill="#0a0b0d" font-size="12" font-weight="700">TLS certificate verification</text><text x="832" y="220" fill="#68645d" font-size="10">database CA + hostname; HTTPS for remote listener</text>
    <rect x="786" y="250" width="376" height="156" rx="4" fill="#e2683c"/><text x="812" y="285" fill="#0a0b0d" font-size="10" letter-spacing="1.2">CONTROLLED WRITE / OFF BY DEFAULT</text>
    <text x="812" y="316" fill="#0a0b0d" font-size="12" font-weight="700">Explicit server enablement + DML policy</text><text x="812" y="339" fill="#0a0b0d" font-size="11">approval token · idempotency key</text><text x="812" y="361" fill="#0a0b0d" font-size="11">HTTP sql:write scope · database grants</text><text x="812" y="385" fill="#0a0b0d" font-size="9">Tool appears only when configured; writes stay policy-bound.</text>
    <text x="38" y="446" fill="#68645d" font-size="10">Transport authentication and database authorization are distinct. Prompt text is guidance—not an enforcement boundary.</text>
  </g>
</svg>
