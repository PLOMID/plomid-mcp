<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">PLOMID-MCP request lifecycle</title><desc id="desc">A tool request enters through an MCP transport, is dispatched and validated, receives applicable authentication, authorization, and SQL policy checks, then executes over the supported SQL protocol. Database responses are bounded, redacted when errors occur, and returned as MCP results.</desc>
  <defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#0a0b0d" stroke-opacity=".04"/></pattern><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#e2683c"/></marker></defs>
  <rect width="1200" height="390" fill="#f3f1ec"/><rect width="1200" height="390" fill="url(#grid)"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <text x="36" y="42" fill="#68645d" font-size="12" letter-spacing="2">ONE REQUEST · TOOL-SPECIFIC POLICY · BOUNDED RESPONSE</text>
    <g transform="translate(36 106)">
      <rect width="154" height="118" rx="3" fill="#0a0b0d"/><text x="77" y="36" fill="#e2683c" font-size="10" text-anchor="middle">01 / CLIENT</text><text x="77" y="65" fill="#f3f1ec" font-size="14" text-anchor="middle" font-weight="700">Tool call</text><text x="77" y="91" fill="#aaa69f" font-size="10" text-anchor="middle">MCP transport</text>
      <path d="M162 59h29" stroke="#e2683c" stroke-width="2" marker-end="url(#a)"/>
      <rect x="204" width="154" height="118" rx="3" fill="#fffefa" stroke="#bdb9b1"/><text x="281" y="36" fill="#68645d" font-size="10" text-anchor="middle">02 / DISPATCH</text><text x="281" y="65" fill="#0a0b0d" font-size="14" text-anchor="middle" font-weight="700">Validate input</text><text x="281" y="91" fill="#68645d" font-size="10" text-anchor="middle">schema · bounds</text>
      <path d="M366 59h29" stroke="#e2683c" stroke-width="2" marker-end="url(#a)"/>
      <rect x="408" width="154" height="118" rx="3" fill="#e2683c"/><text x="485" y="36" fill="#0a0b0d" font-size="10" text-anchor="middle">03 / POLICY</text><text x="485" y="65" fill="#0a0b0d" font-size="14" text-anchor="middle" font-weight="700">Authorize</text><text x="485" y="91" fill="#0a0b0d" font-size="10" text-anchor="middle">applicable checks</text>
      <path d="M570 59h29" stroke="#e2683c" stroke-width="2" marker-end="url(#a)"/>
      <rect x="612" width="154" height="118" rx="3" fill="#fffefa" stroke="#bdb9b1"/><text x="689" y="36" fill="#68645d" font-size="10" text-anchor="middle">04 / DATABASE</text><text x="689" y="65" fill="#0a0b0d" font-size="14" text-anchor="middle" font-weight="700">Execute SQL</text><text x="689" y="91" fill="#68645d" font-size="10" text-anchor="middle">supported protocol</text>
      <path d="M774 59h29" stroke="#e2683c" stroke-width="2" marker-end="url(#a)"/>
      <rect x="816" width="154" height="118" rx="3" fill="#fffefa" stroke="#bdb9b1"/><text x="893" y="36" fill="#68645d" font-size="10" text-anchor="middle">05 / RESULT</text><text x="893" y="65" fill="#0a0b0d" font-size="14" text-anchor="middle" font-weight="700">Bound output</text><text x="893" y="91" fill="#68645d" font-size="10" text-anchor="middle">rows · bytes · time</text>
      <path d="M978 59h29" stroke="#e2683c" stroke-width="2" marker-end="url(#a)"/>
      <rect x="1020" width="112" height="118" rx="3" fill="#0a0b0d"/><text x="1076" y="36" fill="#e2683c" font-size="10" text-anchor="middle">06 / RETURN</text><text x="1076" y="65" fill="#f3f1ec" font-size="14" text-anchor="middle" font-weight="700">MCP</text><text x="1076" y="91" fill="#aaa69f" font-size="10" text-anchor="middle">result / error</text>
    </g>
    <path d="M1076 247v47H77v-47" fill="none" stroke="#0a0b0d" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#a)"/>
    <text x="576" y="319" fill="#68645d" font-size="10" text-anchor="middle" letter-spacing=".5">DATABASE RESPONSE · STRUCTURED COLUMNS / ROWS OR STABLE REDACTED ERROR</text>
    <rect x="243" y="344" width="714" height="28" rx="2" fill="#e7e3da"/><text x="600" y="362" fill="#0a0b0d" font-size="10" text-anchor="middle">Policy differs by tool: metadata, read queries, EXPLAIN and opt-in DML do not share identical checks.</text>
  </g>
</svg>
