<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 440" role="img" aria-labelledby="title desc">
  <title id="title">PLOMID-MCP — Connect AI clients to PLOMID through MCP</title>
  <desc id="desc">A product banner showing MCP clients connecting through the PLOMID-MCP policy layer and supported SQL interface to an independent PLOMID database.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#0a0b0d" stroke-opacity=".045" stroke-width="1"/></pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#e2683c"/></marker>
  </defs>
  <rect width="1440" height="440" fill="#f3f1ec"/><rect width="1440" height="440" fill="url(#grid)"/>
  <path d="M0 0H1440V8H0Z" fill="#e2683c"/>
  <path d="M70 70h5v300h-5z" fill="#e2683c"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <text x="104" y="92" fill="#69655e" font-size="14" letter-spacing="3">PLOMID ECOSYSTEM  /  DEVELOPER INTEGRATION</text>
    <text x="98" y="183" fill="#0a0b0d" font-size="76" font-weight="750" letter-spacing="-4">PLOMID<tspan fill="#e2683c">-MCP</tspan></text>
    <text x="104" y="229" fill="#0a0b0d" font-size="23" font-weight="600">Connect AI clients to PLOMID through MCP.</text>
    <text x="104" y="263" fill="#55524c" font-size="14">A Rust MCP server for governed SQL access to PLOMID.</text>
    <g transform="translate(104 305)">
      <rect width="109" height="32" rx="3" fill="#0a0b0d"/><text x="54.5" y="21" fill="#f3f1ec" font-size="12" text-anchor="middle" letter-spacing="1.3">STDIO</text>
      <rect x="121" width="178" height="32" rx="3" fill="#0a0b0d"/><text x="210" y="21" fill="#f3f1ec" font-size="12" text-anchor="middle" letter-spacing="1.3">STREAMABLE HTTP</text>
      <rect x="311" width="198" height="32" rx="3" fill="#f3f1ec" stroke="#0a0b0d"/><text x="410" y="21" fill="#0a0b0d" font-size="12" text-anchor="middle" letter-spacing="1.1">CONTROLLED SQL EXECUTION</text>
    </g>
  </g>
  <g transform="translate(720 64)">
    <path d="M0 19H648V334H0Z" fill="#0a0b0d"/>
    <path d="M0 19h648" stroke="#e2683c" stroke-width="4"/>
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
      <text x="28" y="56" fill="#aaa69f" font-size="12" letter-spacing="2">A CONTROLLED PATH TO YOUR DATA</text>
      <text x="28" y="82" fill="#77736d" font-size="11">01 / DISCOVER</text><text x="225" y="82" fill="#77736d" font-size="11">02 / AUTHORIZE</text><text x="458" y="82" fill="#77736d" font-size="11">03 / EXECUTE</text>
    </g>
    <g transform="translate(28 115)" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle">
      <rect width="135" height="112" rx="3" fill="#f3f1ec"/>
      <path d="M45 39h45M52 49h31M58 59h19" stroke="#0a0b0d" stroke-width="3" stroke-linecap="round"/>
      <text x="67" y="88" fill="#0a0b0d" font-size="12" font-weight="700">MCP CLIENT</text>
      <path d="M144 56h42" fill="none" stroke="#e2683c" stroke-width="2" marker-end="url(#arrow)"/>
      <rect x="194" width="174" height="112" rx="3" fill="#e2683c"/>
      <path d="M223 37h116M223 47h78M223 57h94" stroke="#0a0b0d" stroke-width="2" opacity=".6"/>
      <text x="281" y="87" fill="#0a0b0d" font-size="14" font-weight="700">PLOMID-MCP</text>
      <path d="M377 56h42" fill="none" stroke="#e2683c" stroke-width="2" marker-end="url(#arrow)"/>
      <rect x="427" width="164" height="112" rx="3" fill="#f3f1ec"/>
      <ellipse cx="509" cy="40" rx="28" ry="10" fill="none" stroke="#0a0b0d" stroke-width="2"/><path d="M481 40v23c0 6 13 11 28 11s28-5 28-11V40M481 51c0 6 13 11 28 11s28-5 28-11" fill="none" stroke="#0a0b0d" stroke-width="2"/>
      <text x="509" y="94" fill="#0a0b0d" font-size="12" font-weight="700">PLOMID DATABASE</text>
    </g>
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11">
      <text x="28" y="268" fill="#e2683c">MCP</text><text x="68" y="268" fill="#c4c0b9">TOOLS</text><circle cx="111" cy="264" r="2" fill="#77736d"/><text x="127" y="268" fill="#c4c0b9">POLICY</text><circle cx="177" cy="264" r="2" fill="#77736d"/><text x="193" y="268" fill="#c4c0b9">BOUNDS</text><circle cx="249" cy="264" r="2" fill="#77736d"/><text x="265" y="268" fill="#c4c0b9">SUPPORTED SQL PROTOCOL</text>
      <text x="28" y="303" fill="#77736d">DATABASE SERVICE RUNS INDEPENDENTLY · SERVER-SIDE CONTROLS APPLY</text>
    </g>
    <circle cx="399" cy="171" r="3.5" fill="#f3f1ec"/>
    <circle cx="174" cy="171" r="3.5" fill="#e2683c"><animateMotion dur="7s" repeatCount="indefinite" path="M0 0 H12"/></circle>
  </g>
  <text x="1365" y="410" fill="#77736d" font-family="ui-monospace,monospace" font-size="11" text-anchor="end" letter-spacing="2">PLOMID / MCP</text>
